name: Automated Job Ingestion Pipeline

on:
  schedule:
    - cron: '0 15 * * *'   # 15:00 UTC daily
  workflow_dispatch:

jobs:
  run-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests beautifulsoup4 python-dotenv

      - name: Verify DATABASE_URL is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: secrets.DATABASE_URL is empty"
            exit 1
          fi
          # Print host only (no password)
          echo "DATABASE host: $(echo "$DATABASE_URL" | sed -E 's|.*@([^/]+)/.*|\1|')"

      - name: Run Ingestion Pipeline
        working-directory: job-ingestion-engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          python ingest.py